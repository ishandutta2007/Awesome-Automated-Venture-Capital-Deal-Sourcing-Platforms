<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#140f2d" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
    </pattern>

    <style>
      /* CSS Keyframe Animations */
      @keyframes pulseRadar {
        0% { r: 10px; opacity: 0.9; }
        50% { opacity: 0.4; }
        100% { r: 180px; opacity: 0; }
      }
      @keyframes sweepScan {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(-12px) translateX(6px); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(10px) translateX(-8px); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -100; }
      }
      @keyframes glowPulse {
        0%, 100% { opacity: 0.35; filter: drop-shadow(0 0 10px #6366f1); }
        50% { opacity: 0.75; filter: drop-shadow(0 0 25px #38bdf8); }
      }

      .radar-wave-1 { animation: pulseRadar 4s cubic-bezier(0.2, 0.6, 0.4, 1) infinite; }
      .radar-wave-2 { animation: pulseRadar 4s cubic-bezier(0.2, 0.6, 0.4, 1) infinite 1.3s; }
      .radar-wave-3 { animation: pulseRadar 4s cubic-bezier(0.2, 0.6, 0.4, 1) infinite 2.6s; }

      .radar-sweep {
        transform-origin: 1020px 210px;
        animation: sweepScan 8s linear infinite;
      }

      .signal-line {
        stroke-dasharray: 8 6;
        animation: dashMove 3s linear infinite;
      }

      .floating-pill-1 { animation: floatSlow1 6s ease-in-out infinite; }
      .floating-pill-2 { animation: floatSlow2 7s ease-in-out infinite; }
      .floating-pill-3 { animation: floatSlow1 8s ease-in-out infinite 1s; }

      .ambient-glow { animation: glowPulse 5s ease-in-out infinite alternate; }

      .font-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.025em;
      }
      .font-sub {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 500;
      }
      .font-mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      }
    </style>
  </defs>

  <!-- Deep Background Canvas -->
  <rect width="100%" height="100%" fill="url(#bgGradient)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- DYNAMIC BACKGROUND LAYER (Signals, Radar, Ambient Glows) -->
  <g id="dynamic-background-elements">
    <!-- Ambient Nebulae / Glow spheres -->
    <circle cx="1020" cy="210" r="160" fill="#38bdf8" opacity="0.08" filter="url(#softGlow)" />
    <circle cx="150" cy="100" r="140" fill="#818cf8" opacity="0.07" filter="url(#softGlow)" />
    <circle cx="600" cy="360" r="180" fill="#c084fc" opacity="0.06" filter="url(#softGlow)" />

    <!-- Animated Data Flow Paths (Deal Sourcing Signals) -->
    <path class="signal-line" d="M 0,90 Q 250,60 500,90 T 1020,210" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.4" />
    <path class="signal-line" d="M 0,330 Q 350,370 700,320 T 1020,210" fill="none" stroke="#818cf8" stroke-width="1.8" stroke-opacity="0.35" style="animation-duration: 4.5s;" />
    <path class="signal-line" d="M 1200,60 Q 950,110 750,80 T 1020,210" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.4" style="animation-duration: 3.8s;" />

    <!-- Right Side Radar Scanner Simulation (Targeting Emerging Startups) -->
    <g transform="translate(0, 0)">
      <!-- Radar Rings -->
      <circle cx="1020" cy="210" r="50" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" />
      <circle cx="1020" cy="210" r="100" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="4 4" />
      <circle cx="1020" cy="210" r="150" fill="none" stroke="#818cf8" stroke-width="1" stroke-opacity="0.2" />

      <!-- Pulsing Radar Waves -->
      <circle class="radar-wave-1" cx="1020" cy="210" r="10" fill="none" stroke="#38bdf8" stroke-width="2" />
      <circle class="radar-wave-2" cx="1020" cy="210" r="10" fill="none" stroke="#818cf8" stroke-width="2" />
      <circle class="radar-wave-3" cx="1020" cy="210" r="10" fill="none" stroke="#c084fc" stroke-width="1.5" />

      <!-- Radar Sweep Fan -->
      <g class="radar-sweep">
        <path d="M 1020 210 L 1170 210 A 150 150 0 0 0 1126 104 Z" fill="url(#cyanGrad)" />
      </g>

      <!-- Discovered Signal Nodes -->
      <g>
        <!-- Startup Alpha -->
        <circle cx="1070" cy="150" r="4" fill="#38bdf8" filter="url(#glow)" />
        <circle cx="1070" cy="150" r="8" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.6" />
        <text x="1080" y="154" fill="#94a3b8" font-size="10" class="font-mono">Signal: Unicorn Founder</text>

        <!-- Startup Beta -->
        <circle cx="970" cy="270" r="4" fill="#10b981" filter="url(#glow)" />
        <circle cx="970" cy="270" r="8" fill="none" stroke="#10b981" stroke-width="1" opacity="0.6" />
        <text x="870" y="274" fill="#94a3b8" font-size="10" class="font-mono">Signal: +340% Repo Stars</text>

        <!-- Startup Gamma -->
        <circle cx="1110" cy="260" r="3.5" fill="#f43f5e" filter="url(#glow)" />
        <text x="1120" y="264" fill="#94a3b8" font-size="10" class="font-mono">Stealth Round</text>

        <!-- Center Radar Origin Hub -->
        <circle cx="1020" cy="210" r="5" fill="#ffffff" filter="url(#glow)" />
      </g>
    </g>

    <!-- Floating Strategic Dynamic Pills (Positioned around periphery so title is never obscured) -->
    <!-- Pill 1: Top Right Background -->
    <g class="floating-pill-1" transform="translate(740, 48)">
      <rect width="180" height="30" rx="15" fill="#1e293b" fill-opacity="0.75" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="16" cy="15" r="4" fill="#38bdf8" />
      <text x="28" y="20" fill="#94a3b8" font-size="11" class="font-mono">⚡ Velocity Signals</text>
    </g>

    <!-- Pill 2: Bottom Right Background -->
    <g class="floating-pill-2" transform="translate(780, 345)">
      <rect width="195" height="30" rx="15" fill="#1e293b" fill-opacity="0.75" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="16" cy="15" r="4" fill="#818cf8" />
      <text x="28" y="20" fill="#94a3b8" font-size="11" class="font-mono">🤝 Relationship Graph</text>
    </g>

    <!-- Pill 3: Top Left Background -->
    <g class="floating-pill-3" transform="translate(480, 48)">
      <rect width="175" height="30" rx="15" fill="#1e293b" fill-opacity="0.75" stroke="#c084fc" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="16" cy="15" r="4" fill="#c084fc" />
      <text x="28" y="20" fill="#94a3b8" font-size="11" class="font-mono">🎯 Thesis Discovery</text>
    </g>
  </g>

  <!-- FOREGROUND LAYER: Text Backdrop & High-Legibility Content -->
  <!-- Subtle dark protective shield behind main text to guarantee 100% foreground contrast -->
  <rect x="65" y="45" width="680" height="325" rx="20" fill="#090d16" fill-opacity="0.7" stroke="#334155" stroke-opacity="0.3" stroke-width="1" filter="url(#softGlow)" />

  <g id="foreground-content" transform="translate(95, 0)">
    <!-- Category Badge -->
    <g transform="translate(0, 85)">
      <rect width="265" height="30" rx="8" fill="url(#badgeGrad)" fill-opacity="0.2" stroke="#818cf8" stroke-width="1.2" />
      <text x="14" y="20" fill="#a5b4fc" font-size="12" class="font-mono" font-weight="700" letter-spacing="1.5">★ AWESOME VC TOOLING</text>
    </g>

    <!-- Main Title (Gradient Fill, Crisp Sharp Render) -->
    <text x="0" y="165" fill="url(#primaryGrad)" font-size="44" class="font-title">
      Automated Venture Capital
    </text>
    <text x="0" y="215" fill="#ffffff" font-size="42" class="font-title">
      Deal Sourcing Platforms
    </text>

    <!-- Subtitle -->
    <text x="0" y="260" fill="#94a3b8" font-size="16" class="font-sub" letter-spacing="0.2">
      Curated Market Intelligence, Signal Detection &amp; Open-Source Dealflow
    </text>

    <!-- Highlight Metrics Strip / Foreground Badges -->
    <g transform="translate(0, 295)">
      <!-- Metric 1 -->
      <g>
        <rect width="175" height="38" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
        <text x="14" y="24" fill="#38bdf8" font-size="13" class="font-mono" font-weight="600">🏢 10 SaaS Leaders</text>
      </g>

      <!-- Metric 2 -->
      <g transform="translate(187, 0)">
        <rect width="185" height="38" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#818cf8" stroke-width="1" stroke-opacity="0.5" />
        <text x="14" y="24" fill="#a5b4fc" font-size="13" class="font-mono" font-weight="600">⚡ 18+ Open Source</text>
      </g>

      <!-- Metric 3 -->
      <g transform="translate(384, 0)">
        <rect width="190" height="38" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#34d399" stroke-width="1" stroke-opacity="0.5" />
        <text x="14" y="24" fill="#34d399" font-size="13" class="font-mono" font-weight="600">🤖 AI &amp; MCP Native</text>
      </g>
    </g>
  </g>
</svg>
